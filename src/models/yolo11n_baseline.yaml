# Space Debris Detection - YOLO11n Baseline (P3/8 – P5/32)
# Standard 3-scale detection: P3 (small), P4 (medium), P5 (large)
# Outputs: 80x80, 40x40, 20x20 feature maps from 640px input
#
# This is the BASELINE model WITHOUT P2 head.
# Minimum detectable object size: ~8x8 px (P3 at stride 8)
# Space debris can be 2-5px → some tiny objects may be missed.

nc: 1  # single class: space_debris
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2    320x320
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4    160x160  <-- will be used by P2-head variant
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8    80x80
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16   40x40
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32   20x20
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]     # 9
  - [-1, 2, C2PSA, [1024]]       # 10

head:
  # FPN Upsampling (Top-Down path)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 11  40x40
  - [[-1, 6], 1, Concat, [1]]                         # 12  cat P4
  - [-1, 2, C3k2, [512, False]]                       # 13  40x40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 14  80x80
  - [[-1, 4], 1, Concat, [1]]                         # 15  cat P3
  - [-1, 2, C3k2, [256, False]]                       # 16  P3/8 — small (80x80)

  # PAN Bottom-Up path
  - [-1, 1, Conv, [256, 3, 2]]                        # 17
  - [[-1, 13], 1, Concat, [1]]                        # 18  cat P4
  - [-1, 2, C3k2, [512, False]]                       # 19  P4/16 — medium (40x40)

  - [-1, 1, Conv, [512, 3, 2]]                        # 20
  - [[-1, 10], 1, Concat, [1]]                        # 21  cat P5
  - [-1, 2, C3k2, [1024, True]]                       # 22  P5/32 — large (20x20)

  # Detection at P3, P4, P5
  - [[16, 19, 22], 1, Detect, [nc]]                   # Detect(P3, P4, P5)
